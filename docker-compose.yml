# Video Studio (Portainer / Compose).
#
# Linux: Intel and AMD, iGPU or dGPU, via /dev/dri. NVIDIA via deploy below.
# Windows Docker Desktop: NVIDIA only. /dev/dri does not exist there.
# NVIDIA driver older than 610: use the latest-legacy image.
services:
  av1-vmaf-studio:
    image: ghcr.io/popel1988/av1-vmaf-studio:latest
    # build: .
    # image: ghcr.io/popel1988/av1-vmaf-studio:latest-legacy
    container_name: av1-vmaf-studio
    restart: unless-stopped

    ports:
      - "${WEB_PORT:-8080}:8080"

    volumes:
      # Set MEDIA_PATH and DATA_PATH in Portainer. Keep DATA_PATH absolute
      # so updates do not drop the queue and settings.
      - ${MEDIA_PATH:-/media}:/media
      - ${DATA_PATH:-./data}:/data
      # Extra trees: mount them and name them in MEDIA_DIRS (Name=/path).
      # - /mnt/nas/movies:/media/movies
      # - /mnt/nas/shows:/media/shows

    # GPU metrics and SMB shares added in the UI.
    privileged: true

    # Intel/AMD render nodes, iGPU and dGPU. On Windows, delete this if
    # compose refuses to start because /dev/dri is missing.
    devices:
      - /dev/dri:/dev/dri

    # Do not add runtime: nvidia. Docker Desktop then mounts CUDA only,
    # and NVENC fails because libnvidia-encode is missing.
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics
      # Host driver older than CUDA 12.6. Does not enable NVENC below 610.
      # - NVIDIA_DISABLE_REQUIRE=true
      - PUID=0
      - PGID=0
      - METRICS_INTERVAL=1.5
      - DATA_DIR=/data
      - MEDIA_DIR=/media
      - RETAIN_VMAF_SESSIONS=true
      # - MEDIA_DIRS=Movies=/media/movies;Shows=/media/shows
      - LOG_LEVEL=INFO
      - LOG_FFMPEG_CMD=1
      # Libva selects iHD (Intel) or radeonsi (AMD). Force iHD only when
      # the wrong driver is chosen.
      # - LIBVA_DRIVER_NAME=iHD
      # With several GPUs, renderD128 may be NVIDIA. Check with:
      # vainfo --display drm --device /dev/dri/renderD128
      - VAAPI_DEVICE=/dev/dri/renderD128
      # - INTEL_ENCODER=qsv

    # Delete this block on hosts without NVIDIA.
    # Optional CPU/RAM caps. GPU memory is not limited.
    deploy:
      resources:
        # limits:
        #   cpus: "8.0"
        #   memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]

    # Instead of privileged: true
    # cap_add: [SYS_ADMIN]
    # group_add: [video, render]
