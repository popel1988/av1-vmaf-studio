name: Build & Push Image (GHCR)

# Baut das Docker-Image und veröffentlicht es in der GitHub Container Registry.
# Läuft bei jedem Push auf main, bei Versions-Tags (v*) und manuell.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Ergibt ghcr.io/popel1988/av1-vmaf-studio
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nötig zum Push nach GHCR (nutzt GITHUB_TOKEN)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Shell-Retry statt wretry.action: mehrzeilige tags/labels von metadata
      # zerlegen sonst die YAML-Übergabe („multiline key may not be an implicit key“).
      - name: Build & Push
        uses: nick-fields/retry@v3
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_LABELS: ${{ steps.meta.outputs.labels }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 45
          command: |
            set -euo pipefail
            TAG_ARGS=()
            while IFS= read -r t; do
              [ -n "$t" ] && TAG_ARGS+=(--tag "$t")
            done <<< "$META_TAGS"
            LABEL_ARGS=()
            while IFS= read -r l; do
              [ -n "$l" ] && LABEL_ARGS+=(--label "$l")
            done <<< "$META_LABELS"
            docker buildx build \
              --platform linux/amd64 \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              "${TAG_ARGS[@]}" \
              "${LABEL_ARGS[@]}" \
              .
